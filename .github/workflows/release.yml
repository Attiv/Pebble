name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v0.1.7
        required: true
        default: v0.1.7

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # The gates the Windows job used to carry. They live in their own job so a
  # release can only be published from code that is formatted, lint clean and
  # under test. It runs on Linux because the macOS runners queue for far longer
  # than these checks take, and it runs beside the macOS builds rather than in
  # front of them: publishing still waits for both.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    environment: action

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libkeyutils-dev

      - name: Validate release version
        run: |
          set -euo pipefail

          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, got '$tag'." >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"

          package_version="$(node -e "const fs = require('node:fs'); console.log(JSON.parse(fs.readFileSync('package.json', 'utf8')).version)")"
          tauri_version="$(node -e "const fs = require('node:fs'); console.log(JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version)")"
          cargo_version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' src-tauri/Cargo.toml | head -n 1)"

          if [[ "$package_version" != "$version" ]]; then
            echo "package.json version '$package_version' does not match tag '$tag'." >&2
            exit 1
          fi
          if [[ "$tauri_version" != "$version" ]]; then
            echo "src-tauri/tauri.conf.json version '$tauri_version' does not match tag '$tag'." >&2
            exit 1
          fi
          if [[ "$cargo_version" != "$version" ]]; then
            echo "src-tauri/Cargo.toml version '$cargo_version' does not match tag '$tag'." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Check Rust lints
        # Reported, not enforced. A stable toolchain bump adds lints, and two
        # releases in a row were held up by warnings in code nobody had
        # touched — the formatting and test steps below are the gates that
        # catch real breakage.
        run: cargo clippy --workspace --all-targets

      - name: Run Rust tests
        run: cargo test --workspace --all-targets

      - name: Run frontend tests
        run: pnpm test

  macos:
    name: macOS Release (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    environment: action

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Validate release version
        run: |
          set -euo pipefail

          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, got '$tag'." >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"

          package_version="$(node -e "const fs = require('node:fs'); console.log(JSON.parse(fs.readFileSync('package.json', 'utf8')).version)")"
          tauri_version="$(node -e "const fs = require('node:fs'); console.log(JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version)")"
          cargo_version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' src-tauri/Cargo.toml | head -n 1)"

          if [[ "$package_version" != "$version" ]]; then
            echo "package.json version '$package_version' does not match tag '$tag'." >&2
            exit 1
          fi
          if [[ "$tauri_version" != "$version" ]]; then
            echo "src-tauri/tauri.conf.json version '$tauri_version' does not match tag '$tag'." >&2
            exit 1
          fi
          if [[ "$cargo_version" != "$version" ]]; then
            echo "src-tauri/Cargo.toml version '$cargo_version' does not match tag '$tag'." >&2
            exit 1
          fi

          echo "PEBBLE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Validate OAuth build config
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET MICROSOFT_CLIENT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is not configured in the 'action' GitHub environment." >&2
              exit 1
            fi
          done
          echo "OAuth client IDs and Google client secret are configured for this release build."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS app
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles app,dmg

      - name: Collect release artifacts
        run: |
          set -euo pipefail
          artifact_dir="release-artifacts"
          mkdir -p "$artifact_dir"

          search_dirs=(
            "target/${{ matrix.target }}/release/bundle/dmg"
            "target/release/bundle/dmg"
          )

          found=()
          for dir in "${search_dirs[@]}"; do
            if [[ -d "$dir" ]]; then
              while IFS= read -r -d '' dmg; do
                found+=("$dmg")
              done < <(find "$dir" -maxdepth 1 -type f -name "*.dmg" -print0)
            fi
          done

          if [[ "${#found[@]}" -eq 0 ]]; then
            echo "No DMG found in expected macOS bundle directories." >&2
            exit 1
          fi

          for dmg in "${found[@]}"; do
            base="$(basename "$dmg")"
            stem="${base%.dmg}"
            cp "$dmg" "$artifact_dir/${stem}-${{ matrix.arch }}.dmg"
          done

          for file in "$artifact_dir"/*; do
            hash="$(shasum -a 256 "$file" | awk '{print $1}')"
            printf '%s  %s\n' "$hash" "$(basename "$file")" > "$file.sha256"
          done

          ls -lh "$artifact_dir"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pebble-macos-${{ matrix.arch }}-${{ env.PEBBLE_VERSION }}
          path: release-artifacts/*
          if-no-files-found: error

  publish:
    name: Publish Complete Release
    needs: [checks, macos]
    runs-on: ubuntu-latest
    environment: action

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pebble-*
          path: release-artifacts
          merge-multiple: true

      - name: Verify release artifact set
        run: |
          set -euo pipefail
          shopt -s nullglob
          macos_arm=(release-artifacts/*-arm64.dmg)
          macos_x64=(release-artifacts/*-x64.dmg)
          checksums=(release-artifacts/*.sha256)
          if (( ${#macos_arm[@]} == 0 || ${#macos_x64[@]} == 0 )); then
            echo "Incomplete macOS artifact set." >&2
            find release-artifacts -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi
          expected_checksums=$((${#macos_arm[@]} + ${#macos_x64[@]}))
          if (( ${#checksums[@]} != expected_checksums )); then
            echo "Expected $expected_checksums checksums, found ${#checksums[@]}." >&2
            exit 1
          fi
          (cd release-artifacts && sha256sum --check --strict *.sha256)

      - name: Create draft, upload complete asset set, and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          version="${tag#v}"
          title="Pebble $tag"
          notes_file="$RUNNER_TEMP/release-notes.md"
          escaped_version="$(printf '%s' "$version" | sed 's/[][\\.^$*+?{}|()]/\\&/g')"
          awk -v version="$escaped_version" '
            $0 ~ "^## \\[" version "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > "$notes_file"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release '$tag' already exists; refusing to replace or unpublish it." >&2
            exit 1
          fi
          gh release create "$tag" --draft --verify-tag --title "$title" --notes-file "$notes_file"
          gh release upload "$tag" release-artifacts/*
          gh release edit "$tag" --draft=false
